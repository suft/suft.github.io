# Vale configuration for blog content

StylesPath = .vale/styles

# Minimum alert level (suggestion, warning, or error)
MinAlertLevel = suggestion

# Vocabulary for blog-specific terms
Vocab = blog

# Packages to download automatically
Packages = https://github.com/errata-ai/write-good/releases/latest/download/write-good.zip, \
           https://github.com/errata-ai/proselint/releases/latest/download/proselint.zip

[*.md]
# Markdown-specific style rules
BasedOnStyles = Vale, write-good, proselint

# Inline ignores for markdown
TokenIgnores = (\$+[^\n$]+\$+), \
               (`[^`]+`), \
               (https?://[^\s]+), \
               (\[.+?\]\(.+?\))

# Optional: Adjust rule severity for blog content
write-good.Passive = warning
write-good.Weasel = suggestion
Microsoft.HeadingAcronyms = NO
