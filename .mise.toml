[tools]
"github:kristoff-it/zine" = "latest"
"github:errata-ai/vale" = "latest"

[tasks.dev]
description = "Run the development server"
run = "zine"

[tasks.build]
description = "Build the release version"
run = "zine release"

[tasks.sync]
description = "Download/sync Vale packages"
run = "vale sync"
